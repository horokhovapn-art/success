AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings backend on AWS: a Lambda function (container image) behind its own
  function URL, talking to a private RDS PostgreSQL instance (db.t4g.micro,
  free-plan compatible). The same function applies the migrations when
  invoked directly.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for the names of the resources in this stack.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into (the account's default VPC works).

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      At least two subnets in different availability zones: the DB subnet
      group needs two, and the function attaches to the same ones. It only
      ever talks to the database, so it needs no NAT gateway.

  ImageUri:
    Type: String
    Description: >-
      Backend image, pinned by digest so every push changes the template:
      <account>.dkr.ecr.<region>.amazonaws.com/<repo>@sha256:...

  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]
    Description: >-
      Must match the platform the image was built for. arm64 Lambda is ~20%
      cheaper and builds natively on Apple Silicon.

  MemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: API function memory in MB; CPU scales with it.

  MaxConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Reserved concurrency: the most function instances running at once. Each
      warm instance holds one database connection. 0 reserves nothing, leaving
      the account's own limit as the cap; new accounts get 10 in total, and
      Lambda refuses any reservation that leaves fewer than 10 unreserved.
      Raise it once the account's limit has been increased.

  DbEngineVersion:
    Type: String
    Default: ""
    Description: >-
      PostgreSQL version. Empty uses the region's current default.

  # The next three parameters were used by the Aurora cluster. They are kept
  # (unused) so the Makefile can keep passing them without errors.
  DbMinCapacity:
    Type: Number
    Default: 0
    MinValue: 0
    Description: Unused since the switch from Aurora to RDS PostgreSQL.

  DbMaxCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Unused since the switch from Aurora to RDS PostgreSQL.

  DbAutoPauseSeconds:
    Type: Number
    Default: 300
    MinValue: 300
    MaxValue: 86400
    Description: Unused since the switch from Aurora to RDS PostgreSQL.

  DbName:
    Type: String
    Default: meetings

  DbUsername:
    Type: String
    Default: app

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    AllowedPattern: "[a-zA-Z0-9_-]+"
    Description: >-
      Master password. Letters, digits, underscore and dash only: it is embedded
      in a connection URL, where other characters would need escaping.

  AppTimezone:
    Type: String
    Default: Europe/Kyiv

  CorsOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated origins allowed to call the API.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

  CognitoUserPoolId:
    Type: String
    Description: User pool whose access tokens the API accepts (the auth stack's UserPoolId).

  CognitoClientId:
    Type: String
    Description: The app client those tokens must be issued to (the auth stack's UserPoolClientId).

  CognitoJwks:
    Type: String
    Description: >-
      The pool's public signing keys (its jwks.json), base64-encoded. The
      function has no internet access to fetch them itself; `make
      aws-deploy-backend` downloads them.

Conditions:
  HasDbEngineVersion: !Not [!Equals [!Ref DbEngineVersion, ""]]
  HasMaxConcurrency: !Not [!Equals [!Ref MaxConcurrency, 0]]

Resources:
  # --- networking -----------------------------------------------------------

  FunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} backend function"
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-function"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} database"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref FunctionSecurityGroup
          Description: Function to PostgreSQL
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- database -------------------------------------------------------------

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} database subnets"
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # A single RDS PostgreSQL instance instead of an Aurora cluster: Aurora on
  # AWS free-plan accounts requires "express configuration", which
  # CloudFormation cannot set. db.t4g.micro with 20 GB is free-tier eligible.
  DbInstance:
    Type: AWS::RDS::DBInstance
    # A demo stack: `make aws-destroy` should leave nothing billable behind.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db-1"
      Engine: postgres
      EngineVersion: !If [HasDbEngineVersion, !Ref DbEngineVersion, !Ref "AWS::NoValue"]
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageType: gp2
      DBName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      StorageEncrypted: true
      BackupRetentionPeriod: 0
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- function -------------------------------------------------------------

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Write logs, and manage the network interfaces a VPC function needs.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-backend"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ApiFunction:
    Type: AWS::Lambda::Function
    # Migrations run right after the stack settles, so the database must exist.
    DependsOn: DbInstance
    Properties:
      FunctionName: !Sub "${ProjectName}-backend"
      Description: Meetings API (FastAPI through Mangum)
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures:
        - !Ref Architecture
      Role: !GetAtt FunctionRole.Arn
      MemorySize: !Ref MemorySize
      ReservedConcurrentExecutions: !If [HasMaxConcurrency, !Ref MaxConcurrency, !Ref "AWS::NoValue"]
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref LogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref FunctionSecurityGroup
      Environment:
        Variables:
          # NOTE: the password ends up readable in the function configuration.
          # Moving it to SSM Parameter Store is the first thing to harden here.
          DATABASE_URL: !Sub
            - "postgresql+asyncpg://${DbUsername}:${DbPassword}@${Endpoint}:${Port}/${DbName}"
            - Endpoint: !GetAtt DbInstance.Endpoint.Address
              Port: !GetAtt DbInstance.Endpoint.Port
          APP_TIMEZONE: !Ref AppTimezone
          CORS_ORIGINS: !Ref CorsOrigins
          LOG_LEVEL: !Ref LogLevel
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_JWKS: !Ref CognitoJwks
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- function URL ---------------------------------------------------------

  # The function's own HTTPS endpoint (https://<id>.lambda-url.<region>.on.aws).
  # Public: FastAPI itself checks the Cognito access token on every meetings
  # request (the function URL cannot validate Cognito tokens). CORS stays in FastAPI;
  # configuring it here too would override the app's headers. The URL and the
  # permissions below take no tags.
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED

  # A public URL needs both statements: InvokeFunctionUrl for the URL itself,
  # and InvokeFunction limited to calls that arrive through it.
  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ApiUrl:
    Description: Base URL of the backend (the function URL, without its trailing slash)
    Value: !Sub ["https://${Host}", {Host: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]}]
  HealthUrl:
    Description: Health check
    Value: !Sub ["https://${Host}/health", {Host: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]}]
  DocsUrl:
    Description: Swagger UI
    Value: !Sub ["https://${Host}/docs", {Host: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]}]
  FunctionUrlDomain:
    Description: The function URL's host name
    Value: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
  DatabaseEndpoint:
    Description: RDS PostgreSQL endpoint, private to the VPC
    Value: !GetAtt DbInstance.Endpoint.Address
  FunctionName:
    Value: !Ref ApiFunction
  LogGroupName:
    Value: !Ref LogGroup